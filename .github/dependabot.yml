version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/Recife
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    ignore:
      # CodeQL has multiple entry points that must remain on one audited,
      # versioned release. Digest-only updates from the moving releases/v4
      # branch are intentionally reviewed and applied as one manual change.
      - dependency-name: github/codeql-action/*

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: America/Recife
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
