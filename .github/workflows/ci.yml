name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - macos-15-intel
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip pytest .

      - name: Run tests
        run: python -m pytest -v

      - name: Run CLI smoke tests
        run: |
          lsusers --version
          lsusers --help
          lsusers human --names >/dev/null
          lsusers system --json >/dev/null
          lsusers all --csv >/dev/null
          lsusers count

  debian-package:
    name: Debian package
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Debian build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            debhelper \
            devscripts \
            dh-python \
            lintian \
            pybuild-plugin-pyproject \
            python3-all \
            python3-pytest \
            python3-setuptools

      - name: Build Debian package
        run: dpkg-buildpackage -us -uc -b

      - name: Run Lintian
        run: |
          lintian \
            --display-info \
            --display-experimental \
            --pedantic \
            ../lsusers_*_amd64.changes

      - name: Prepare Debian package artifact
        run: |
          mkdir -p artifacts
          cp ../lsusers_*_all.deb artifacts/

      - name: Verify APT installation
        run: |
          sudo apt-get update
          sudo apt install -y ./artifacts/lsusers_*_all.deb
          lsusers --version
          lsusers count

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: lsusers-deb
          path: artifacts/*.deb
          if-no-files-found: error
