name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            debhelper \
            devscripts \
            dh-python \
            lintian \
            pybuild-plugin-pyproject \
            python3-all \
            python3-pytest \
            python3-setuptools

      - name: Run Python tests
        run: |
          PYTHONPATH=src python3 -m pytest -v

      - name: Build Debian package
        run: |
          dpkg-buildpackage -us -uc -b

      - name: Run Lintian
        run: |
          lintian \
            --display-info \
            --display-experimental \
            --pedantic \
            ../lsusers_*_amd64.changes

      - name: Prepare Debian package artifact
        run: |
          mkdir -p artifacts
          cp ../lsusers_*_all.deb artifacts/

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: lsusers-deb
          path: artifacts/*.deb
          if-no-files-found: error
