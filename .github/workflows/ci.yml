name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - macos-15-intel
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip pytest .

      - name: Run tests
        run: python -m pytest -v

      - name: Run CLI smoke tests
        run: |
          lsusers --version
          lsusers --help
          lsusers human --names >/dev/null
          lsusers system --json >/dev/null
          lsusers all --csv >/dev/null
          lsusers count

  debian-package:
    name: Debian package
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify synchronized release versions
        run: |
          version=$(python3 -c 'import re; print(re.search(r"^version = \"([^\"]+)\"", open("pyproject.toml").read(), re.MULTILINE).group(1))')
          python3 scripts/release/verify-version.py "v$version"

      - name: Install Debian build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            debhelper \
            devscripts \
            dh-python \
            lintian \
            pybuild-plugin-pyproject \
            python3-all \
            python3-pytest \
            python3-setuptools

      - name: Build Debian package
        run: dpkg-buildpackage -us -uc -b

      - name: Run Lintian
        run: |
          lintian \
            --display-info \
            --display-experimental \
            --pedantic \
            ../lsusers_*_amd64.changes

      - name: Prepare Debian package artifact
        run: |
          mkdir -p artifacts
          cp ../lsusers_*_all.deb artifacts/

      - name: Verify APT installation
        run: |
          sudo apt-get update
          sudo apt install -y ./artifacts/lsusers_*_all.deb
          lsusers --version
          lsusers count

      - name: Upload Debian package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lsusers-deb
          path: artifacts/*.deb
          if-no-files-found: error

  release-integrity:
    name: Release artifact integrity
    needs: debian-package
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Download the tested Debian package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lsusers-deb
          path: release-assets

      - name: Build and verify the complete release asset set
        run: |
          python -m pip install --upgrade pip build==1.3.0 twine==6.2.0
          python -m build --outdir release-assets
          python -m twine check release-assets/*.whl release-assets/*.tar.gz
          version=$(python -c 'import re; print(re.search(r"^version = \"([^\"]+)\"", open("pyproject.toml").read(), re.MULTILINE).group(1))')
          scripts/release/verify-assets.sh "v$version" release-assets
