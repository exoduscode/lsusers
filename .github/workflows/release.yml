name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-source:
    name: Validate immutable release source
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tag and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify annotated tag, main ancestry, and versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = tag
          git fetch --no-tags origin main:refs/remotes/origin/main
          release_commit=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          test "$release_commit" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$release_commit" origin/main
          python3 scripts/release/verify-version.py "$GITHUB_REF_NAME"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; refusing replacement" >&2
            exit 1
          fi

  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: validate-source
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - macos-15-intel
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Checkout immutable tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install and test
        run: |
          python -m pip install --upgrade pip pytest .
          python -m pytest -v
          lsusers --version
          lsusers human --names >/dev/null
          lsusers system --json >/dev/null
          lsusers all --csv >/dev/null
          lsusers count

  build-python:
    name: Build and verify Python distributions
    needs:
      - validate-source
      - test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout immutable tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Build wheel and source distribution once
        run: |
          python -m pip install --upgrade pip build==1.3.0 twine==6.2.0
          python -m build
          python -m twine check dist/*

      - name: Test installation from wheel and source distribution
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/pip" install --no-deps dist/*.whl
          "$RUNNER_TEMP/wheel-venv/bin/lsusers" --version
          python -m venv "$RUNNER_TEMP/sdist-venv"
          "$RUNNER_TEMP/sdist-venv/bin/pip" install --no-deps dist/*.tar.gz
          "$RUNNER_TEMP/sdist-venv/bin/lsusers" --version

      - name: Upload immutable Python distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-python
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  build-debian:
    name: Build and verify Debian package
    needs:
      - validate-source
      - test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout immutable tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Debian build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            debhelper \
            devscripts \
            dh-python \
            lintian \
            pybuild-plugin-pyproject \
            python3-all \
            python3-pytest \
            python3-setuptools

      - name: Build Debian package once
        run: dpkg-buildpackage -us -uc -b

      - name: Audit and install Debian package
        run: |
          lintian --display-info --display-experimental --pedantic ../lsusers_*_amd64.changes
          mkdir release-debian
          cp ../lsusers_*_all.deb release-debian/
          deb=$(find release-debian -maxdepth 1 -name '*.deb' -print -quit)
          test "$(dpkg-deb --field "$deb" Package)" = lsusers
          test "$(dpkg-deb --field "$deb" Version)" = "${GITHUB_REF_NAME#v}-1"
          test "$(dpkg-deb --field "$deb" Architecture)" = all
          sudo apt-get install -y ./release-debian/lsusers_*_all.deb
          lsusers --version
          lsusers count

      - name: Upload immutable Debian package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-debian
          path: release-debian/*.deb
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attest and publish GitHub Release
    needs:
      - build-python
      - build-debian
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout immutable tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the already-tested artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify combined assets and create checksums
        run: |
          scripts/release/verify-assets.sh "$GITHUB_REF_NAME" release-assets
          cd release-assets
          sha256sum *.whl *.tar.gz *.deb >SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Generate signed build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: release-assets/*

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; refusing replacement" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --draft \
            --verify-tag \
            --title "lsusers ${GITHUB_REF_NAME#v}" \
            --generate-notes
          gh release edit "$GITHUB_REF_NAME" --draft=false

  update-homebrew:
    name: Open Homebrew tap update
    needs: publish
    runs-on: ubuntu-24.04
    environment: homebrew
    permissions:
      contents: read
    steps:
      - name: Create least-privilege tap token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: exoduscode
          repositories: homebrew-tap

      - name: Checkout immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source

      - name: Checkout Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: exoduscode/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          path: tap

      - name: Calculate tagged source checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 3 --output source.tar.gz \
            "https://github.com/exoduscode/lsusers/archive/refs/tags/${RELEASE_TAG}.tar.gz"
          echo "archive_sha256=$(sha256sum source.tar.gz | cut -d ' ' -f 1)" >>"$GITHUB_ENV"

      - name: Update formula on an idempotent release branch
        id: formula
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: tap
        run: |
          version=${RELEASE_TAG#v}
          branch="release/lsusers-$version"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            branch_exists=true
            git fetch origin "$branch"
            git switch --create "$branch" --track "origin/$branch"
          else
            branch_exists=false
            git switch --create "$branch"
          fi
          python ../source/scripts/release/update-homebrew-formula.py \
            Formula/lsusers.rb "$version" "$archive_sha256"
          if git diff --quiet; then
            echo "formula already contains lsusers $version"
            echo "branch_ready=$branch_exists" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "exoduscode-release[bot]"
          git config user.email "exoduscode-release[bot]@users.noreply.github.com"
          git add Formula/lsusers.rb
          git commit -m "Update lsusers to $version"
          git push --set-upstream origin "$branch"
          echo "branch_ready=true" >>"$GITHUB_OUTPUT"

      - name: Open tap pull request if needed
        if: steps.formula.outputs.branch_ready == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: tap
        run: |
          version=${RELEASE_TAG#v}
          branch="release/lsusers-$version"
          if gh pr view "$branch" --repo exoduscode/homebrew-tap >/dev/null 2>&1; then
            echo "tap pull request already exists"
          else
            gh pr create --repo exoduscode/homebrew-tap \
              --base main --head "$branch" \
              --title "Update lsusers to $version" \
              --body "Automated update from the immutable lsusers $RELEASE_TAG release."
          fi
